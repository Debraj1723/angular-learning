<app-header />
<main>
  <ul id="users">
    @for(user of users;track user.id){
    <li>
      <app-user
        [selected]="selectedUser?.id === user.id"
        [user]="user"
        (select)="onUserSelcet(user)"
      />
    </li>
    }
  </ul>
  @if(selectedUser){
  <app-tasks [userId]="selectedUser.id" [name]="selectedUser.name"></app-tasks>
  }@else{
  <p>Please selcet an user</p>
  }
</main>
