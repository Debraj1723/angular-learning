<div class="backdrop" (click)="closePopup.emit()"></div>
<dialog open>
  <h2>Add Task</h2>
  <form (ngSubmit)="onFormSubmit()">
    <p>
      <label for="title">Title</label>
      <input type="text" id="title" name="title" [(ngModel)]="formData.title" />
    </p>

    <p>
      <label for="summary">Summary</label>
      <textarea id="summary" rows="5" name="summary" [(ngModel)]="formData.summary"></textarea>
    </p>

    <p>
      <label for="due-date">Due Date</label>
      <input type="date" id="due-date" name="due-date" [(ngModel)]="formData.dueDate" />
    </p>

    <p class="actions">
      <button type="button" (click)="closePopup.emit()">Cancel</button>
      <button type="submit">Create</button>
    </p>
  </form>
</dialog>
